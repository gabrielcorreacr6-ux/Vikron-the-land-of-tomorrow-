<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RPG Ilhas 3D - Circuito Gigante</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui">
        <strong>🗺️ RPG Circuito de Ilhas & Ferrovia</strong><br>
        Madeira: <span id="wood">10</span> | Pedra: <span id="stone">5</span><br>
        Minérios: Carvão(<span id="coal">0</span>) Ouro(<span id="gold">0</span>) Diamante(<span id="diamond">0</span>) Petróleo(<span id="oil">0</span>)<br>
        Clã: <span id="clan">Nenhum</span> | Status: <span id="status">Explorando</span>
    </div>
    
    <div id="alert-box">⚠️ Zona Proibida: Construção proibida a menos de 30 blocos da ferrovia/bilheteria!</div>
    
    <div id="controls-hint">Arraste o Joystick esquerdo para andar | Botão amarelo para Coletar</div>
    
    <button id="action-btn">COLETAR / CAVAR</button>
    
    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>

    <!-- Importação do Three.js e do script do jogo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
